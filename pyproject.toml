[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting-prediction-markets"
version = "0.1.0"
description = "ML models for forecasting Polymarket binary prediction market outcomes"
requires-python = ">=3.13"
dependencies = [
    # Exact pins: saved models only load reliably, and features only compute identically,
    # under the versions a release was built with. Changing one = train a new release
    # (CLAUDE.md, ADR-019 amendment); tests/test_environment.py checks the installed versions.
    # Data
    "pandas==3.0.6",
    "numpy==2.5.4",
    "pyarrow==26.0.0",

    # HTTP / APIs
    "requests>=2.32.5",
    "anthropic>=0.97.0",
    "pytrends>=4.9.2",

    # Database / storage
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2.1",
    "boto3>=1.35",
    "duckdb>=1.1",

    # ML
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "shap>=0.46",

    # API (ADR-017)
    "fastapi>=0.115",
    "uvicorn>=0.32",

    # Visualisation
    "matplotlib>=3.10.6",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "data_collection_pipeline*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort
ignore = ["E501"]           # line length handled by formatter
